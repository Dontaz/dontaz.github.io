<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR Code Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23111113'/><g fill='none' stroke='%236ea8fe' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M11 7H7v4 M21 7h4v4 M11 25H7v-4 M21 25h4v-4'/><rect x='10' y='10' width='4' height='4' rx='1'/><rect x='18' y='10' width='4' height='4' rx='1'/><rect x='10' y='18' width='4' height='4' rx='1'/></g><rect x='18' y='18' width='4' height='4' rx='1' fill='%236ea8fe'/></svg>">
<style>
  :root{
    box-sizing:border-box;
    --bg:#121316;
    --panel:#1a1c20;
    --panel-2:#1f2226;
    --border:#2b2e34;
    --text:#eceef0;
    --text-dim:#9aa0a8;
    --accent:#7ea0b8;
    --accent-text:#0e1216;
    --radius:6px;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{background:var(--bg)}
  body{
    margin:0;
    color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;padding:32px 24px 64px}
  .topbar{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:10px;
    margin-bottom:40px;
  }
  .lang-toggle{
    display:flex;
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .lang-btn{
    font-family:inherit;
    font-size:12.5px;
    font-weight:500;
    padding:7px 12px;
    background:var(--panel-2);
    color:var(--text-dim);
    border:none;
    cursor:pointer;
    transition:background .15s ease,color .15s ease;
  }
  .lang-btn+.lang-btn{border-left:1px solid var(--border)}
  .lang-btn:hover{color:var(--text)}
  .lang-btn.active{background:var(--accent);color:var(--accent-text)}
  .home-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:32px;height:32px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:var(--panel-2);
    color:var(--text-dim);
    text-decoration:none;
    transition:color .15s ease,border-color .15s ease;
  }
  .home-btn:hover{color:var(--text);border-color:#454a52}
  header.intro{margin-bottom:36px}
  h1{
    font-size:22px;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0 0 6px;
  }
  header.intro p{
    margin:0;
    color:var(--text-dim);
    font-size:14.5px;
    max-width:56ch;
    line-height:1.5;
  }
  main.grid{
    display:grid;
    grid-template-columns:1.1fr 1fr;
    gap:20px;
    align-items:start;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:24px;
    min-width:0;
  }
  label{
    display:block;
    font-size:13px;
    color:var(--text-dim);
    margin-bottom:8px;
  }
  textarea{
    width:100%;
    resize:vertical;
    min-height:76px;
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:var(--radius);
    color:var(--text);
    font-family:inherit;
    font-size:14.5px;
    padding:12px 14px;
    line-height:1.5;
  }
  textarea::placeholder{color:#5c6169}
  textarea:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  .color-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:22px;
  }
  .swatch-input{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:6px 10px;
  }
  .swatch-input input[type="color"]{
    -webkit-appearance:none;
    appearance:none;
    width:26px;height:26px;
    border:none;border-radius:4px;
    background:none;padding:0;
    cursor:pointer;
  }
  .swatch-input input[type="color"]::-webkit-color-swatch-wrapper{padding:0}
  .swatch-input input[type="color"]::-webkit-color-swatch{border:1px solid var(--border);border-radius:4px}
  .swatch-input input[type="text"]{
    flex:1;
    border:none;background:none;color:var(--text);
    font-family:'JetBrains Mono',ui-monospace,monospace;
    font-size:13px;
    padding:6px 0;
    width:100%;
  }
  .checkbox-row{
    display:flex;
    align-items:center;
    gap:9px;
    margin-top:18px;
    font-size:14px;
    color:var(--text);
    cursor:pointer;
  }
  .checkbox-row input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
  .checkbox-row span{user-select:none}
  .actions-primary{margin-top:26px}
  .actions-secondary{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:12px;
  }
  .btn{
    font-family:inherit;
    font-size:13.5px;
    font-weight:500;
    padding:10px 16px;
    border-radius:var(--radius);
    border:1px solid var(--border);
    background:var(--panel-2);
    color:var(--text);
    cursor:pointer;
    transition:border-color .15s ease, opacity .15s ease;
  }
  .btn:hover:not(:disabled){border-color:#454a52}
  .btn.primary{
    background:var(--accent);
    color:var(--accent-text);
    border-color:var(--accent);
    width:100%;
  }
  .btn.primary:hover:not(:disabled){opacity:.9}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .status{
    min-height:18px;
    margin:14px 0 0;
    font-size:13px;
    color:var(--text-dim);
  }
  .preview{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:340px;
  }
  .canvas-holder{
    width:min(280px,70vw);
    height:min(280px,70vw);
    border-radius:4px;
    background-color:#1c1e22;
    background-image:
      linear-gradient(45deg,#26292f 25%,transparent 25%),
      linear-gradient(-45deg,#26292f 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#26292f 75%),
      linear-gradient(-45deg,transparent 75%,#26292f 75%);
    background-size:16px 16px;
    background-position:0 0,0 8px,8px -8px,-8px 0px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:14px;
    overflow:hidden;
  }
  #qrCanvas{
    display:block;
    width:100%;
    height:100%;
    min-width:0;
    min-height:0;
    max-width:100%;
    max-height:100%;
    image-rendering:pixelated;
  }
  @media (max-width:720px){
    main.grid{grid-template-columns:1fr}
    .preview{min-height:280px;order:-1}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="lang-toggle" role="group" aria-label="Language">
      <button type="button" class="lang-btn active" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="ru">RU</button>
    </div>
    <a class="home-btn" href="https://dontaz.com" aria-label="Home">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-9"/><path d="M9.5 20v-5.5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1V20"/></svg>
    </a>
  </div>

  <header class="intro">
    <h1 data-i18n="title">QR Code</h1>
    <p data-i18n="subtitle">Enter text or a link, set your colors, then generate the QR code.</p>
  </header>

  <main class="grid">
    <section class="panel controls">
      <label for="text" data-i18n="textLabel">Text or link</label>
      <textarea id="text" data-i18n-placeholder="textPlaceholder" placeholder="https://example.com"></textarea>

      <div class="color-row">
        <div class="color-field">
          <label for="fgHex" data-i18n="fgLabel">QR color</label>
          <div class="swatch-input">
            <input type="color" id="fgColor" value="#000000">
            <input type="text" id="fgHex" value="#000000" maxlength="7" spellcheck="false">
          </div>
        </div>
        <div class="color-field">
          <label for="bgHex" data-i18n="bgLabel">Background color</label>
          <div class="swatch-input">
            <input type="color" id="bgColor" value="#FFFFFF">
            <input type="text" id="bgHex" value="#FFFFFF" maxlength="7" spellcheck="false">
          </div>
        </div>
      </div>

      <label class="checkbox-row" for="transparent">
        <input type="checkbox" id="transparent">
        <span data-i18n="transparentLabel">Transparent background</span>
      </label>

      <div class="actions-primary">
        <button id="generateBtn" class="btn primary" data-i18n="generateBtn">Generate QR code</button>
      </div>
      <div class="actions-secondary">
        <button id="downloadPng" class="btn" data-i18n="downloadPngBtn" disabled>Download PNG</button>
        <button id="downloadSvg" class="btn" data-i18n="downloadSvgBtn" disabled>Download SVG</button>
        <button id="copyBtn" class="btn" data-i18n="copyBtn" disabled>Copy</button>
      </div>
      <p class="status" id="status" aria-live="polite"></p>
    </section>

    <section class="panel preview">
      <div class="canvas-holder">
        <canvas id="qrCanvas" width="1024" height="1024"></canvas>
      </div>
    </section>
  </main>
</div>

</script>
<script>
(function(){
  var dict = {
    en: {
      pageTitle: "QR Code Generator",
      title: "QR Code",
      subtitle: "Enter text or a link, set your colors, then generate the QR code.",
      textLabel: "Text or link",
      textPlaceholder: "https://example.com",
      fgLabel: "QR color",
      bgLabel: "Background color",
      transparentLabel: "Transparent background",
      generateBtn: "Generate QR code",
      downloadPngBtn: "Download PNG",
      downloadSvgBtn: "Download SVG",
      copyBtn: "Copy",
      empty: "Enter text, then press \u201cGenerate QR code.\u201d",
      error: "Couldn't generate a QR code for this text.",
      svgError: "Couldn't generate the SVG.",
      copied: "Copied to clipboard.",
      copyUnsupported: "Copying isn't supported in this browser. Download the file instead.",
      copyFailed: "Couldn't copy. Download the file instead.",
      generated: "QR code generated.",
      engineError: "The QR engine failed to load. Please refresh the page."
    },
    ru: {
      pageTitle: "\u0413\u0435\u043d\u0435\u0440\u0430\u0442\u043e\u0440 QR-\u043a\u043e\u0434\u043e\u0432",
      title: "QR-\u043a\u043e\u0434",
      subtitle: "\u0412\u0432\u0435\u0434\u0438\u0442\u0435 \u0442\u0435\u043a\u0441\u0442 \u0438\u043b\u0438 \u0441\u0441\u044b\u043b\u043a\u0443, \u043d\u0430\u0441\u0442\u0440\u043e\u0439\u0442\u0435 \u0446\u0432\u0435\u0442\u0430 \u0438 \u043d\u0430\u0436\u043c\u0438\u0442\u0435 \u00ab\u0421\u043e\u0437\u0434\u0430\u0442\u044c QR-\u043a\u043e\u0434\u00bb.",
      textLabel: "\u0422\u0435\u043a\u0441\u0442 \u0438\u043b\u0438 \u0441\u0441\u044b\u043b\u043a\u0430",
      textPlaceholder: "https://example.com",
      fgLabel: "\u0426\u0432\u0435\u0442 QR-\u043a\u043e\u0434\u0430",
      bgLabel: "\u0426\u0432\u0435\u0442 \u0444\u043e\u043d\u0430",
      transparentLabel: "\u041f\u0440\u043e\u0437\u0440\u0430\u0447\u043d\u044b\u0439 \u0444\u043e\u043d",
      generateBtn: "\u0421\u043e\u0437\u0434\u0430\u0442\u044c QR-\u043a\u043e\u0434",
      downloadPngBtn: "\u0421\u043a\u0430\u0447\u0430\u0442\u044c PNG",
      downloadSvgBtn: "\u0421\u043a\u0430\u0447\u0430\u0442\u044c SVG",
      copyBtn: "\u041a\u043e\u043f\u0438\u0440\u043e\u0432\u0430\u0442\u044c",
      empty: "\u0412\u0432\u0435\u0434\u0438\u0442\u0435 \u0442\u0435\u043a\u0441\u0442 \u0438 \u043d\u0430\u0436\u043c\u0438\u0442\u0435 \u00ab\u0421\u043e\u0437\u0434\u0430\u0442\u044c QR-\u043a\u043e\u0434\u00bb.",
      error: "\u041d\u0435 \u0443\u0434\u0430\u043b\u043e\u0441\u044c \u0441\u043e\u0437\u0434\u0430\u0442\u044c QR-\u043a\u043e\u0434 \u0434\u043b\u044f \u044d\u0442\u043e\u0433\u043e \u0442\u0435\u043a\u0441\u0442\u0430.",
      svgError: "\u041d\u0435 \u0443\u0434\u0430\u043b\u043e\u0441\u044c \u0441\u043e\u0437\u0434\u0430\u0442\u044c SVG.",
      copied: "\u0421\u043a\u043e\u043f\u0438\u0440\u043e\u0432\u0430\u043d\u043e \u0432 \u0431\u0443\u0444\u0435\u0440 \u043e\u0431\u043c\u0435\u043d\u0430.",
      copyUnsupported: "\u041a\u043e\u043f\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435 \u043d\u0435 \u043f\u043e\u0434\u0434\u0435\u0440\u0436\u0438\u0432\u0430\u0435\u0442\u0441\u044f \u0432 \u044d\u0442\u043e\u043c \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u0435. \u0421\u043a\u0430\u0447\u0430\u0439\u0442\u0435 \u0444\u0430\u0439\u043b.",
      copyFailed: "\u041d\u0435 \u0443\u0434\u0430\u043b\u043e\u0441\u044c \u0441\u043a\u043e\u043f\u0438\u0440\u043e\u0432\u0430\u0442\u044c. \u0421\u043a\u0430\u0447\u0430\u0439\u0442\u0435 \u0444\u0430\u0439\u043b \u0432\u0440\u0443\u0447\u043d\u0443\u044e.",
      generated: "QR-\u043a\u043e\u0434 \u0441\u043e\u0437\u0434\u0430\u043d.",
      engineError: "\u041d\u0435 \u0443\u0434\u0430\u043b\u043e\u0441\u044c \u0437\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u044c \u0434\u0432\u0438\u0436\u043e\u043a QR. \u041e\u0431\u043d\u043e\u0432\u0438\u0442\u0435 \u0441\u0442\u0440\u0430\u043d\u0438\u0446\u0443."
    }
  };

  var canvas = document.getElementById('qrCanvas');
  var textEl = document.getElementById('text');
  var fgColor = document.getElementById('fgColor');
  var fgHex = document.getElementById('fgHex');
  var bgColor = document.getElementById('bgColor');
  var bgHex = document.getElementById('bgHex');
  var transparent = document.getElementById('transparent');
  var statusEl = document.getElementById('status');
  var generateBtn = document.getElementById('generateBtn');
  var btnPng = document.getElementById('downloadPng');
  var btnSvg = document.getElementById('downloadSvg');
  var btnCopy = document.getElementById('copyBtn');
  var langButtons = document.querySelectorAll('.lang-btn');

  var HEX_RE = /^#[0-9A-Fa-f]{6}$/;
  var hasContent = false;
  var currentLang = 'en';
  var statusKey = 'empty';
  var engineReady = typeof QRCode !== 'undefined';

  function setStatus(key){
    statusKey = key;
    statusEl.textContent = key ? dict[currentLang][key] : '';
  }

  function setDownloadButtons(enabled){
    btnPng.disabled = !enabled;
    btnSvg.disabled = !enabled;
    btnCopy.disabled = !enabled;
  }

  function applyLanguage(lang){
    currentLang = lang;
    document.documentElement.lang = lang;
    document.title = dict[lang].pageTitle;
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var key = el.getAttribute('data-i18n');
      if(dict[lang][key] !== undefined) el.textContent = dict[lang][key];
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el){
      var key = el.getAttribute('data-i18n-placeholder');
      if(dict[lang][key] !== undefined) el.placeholder = dict[lang][key];
    });
    langButtons.forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
    });
    setStatus(statusKey);
  }

  langButtons.forEach(function(btn){
    btn.addEventListener('click', function(){
      applyLanguage(btn.getAttribute('data-lang'));
    });
  });

  function currentColors(){
    return {
      dark: fgHex.value + 'ff',
      light: bgHex.value + (transparent.checked ? '00' : 'ff')
    };
  }

  function clearCanvas(){
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,canvas.width,canvas.height);
  }

  function generate(){
    if(!engineReady){
      engineReady = typeof QRCode !== 'undefined';
    }
    if(!engineReady){
      hasContent = false;
      setDownloadButtons(false);
      setStatus('engineError');
      return;
    }
    var text = textEl.value.trim();
    if(!text){
      clearCanvas();
      hasContent = false;
      setDownloadButtons(false);
      setStatus('empty');
      textEl.focus();
      return;
    }
    QRCode.toCanvas(canvas, text, {
      width: 1024,
      margin: 2,
      errorCorrectionLevel: 'M',
      color: currentColors()
    }, function(err){
      if(err){
        hasContent = false;
        setDownloadButtons(false);
        setStatus('error');
        return;
      }
      hasContent = true;
      setDownloadButtons(true);
      setStatus('generated');
    });
  }

  function download(url, filename){
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  generateBtn.addEventListener('click', generate);

  textEl.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      generate();
    }
  });

  fgColor.addEventListener('input', function(){
    fgHex.value = fgColor.value.toUpperCase();
  });
  bgColor.addEventListener('input', function(){
    bgHex.value = bgColor.value.toUpperCase();
  });
  fgHex.addEventListener('change', function(){
    var v = fgHex.value.trim();
    if(HEX_RE.test(v)){ fgColor.value = v; }
    else { fgHex.value = fgColor.value.toUpperCase(); }
  });
  bgHex.addEventListener('change', function(){
    var v = bgHex.value.trim();
    if(HEX_RE.test(v)){ bgColor.value = v; }
    else { bgHex.value = bgColor.value.toUpperCase(); }
  });

  btnPng.addEventListener('click', function(){
    if(!hasContent) return;
    canvas.toBlob(function(blob){
      var url = URL.createObjectURL(blob);
      download(url, 'qr-code.png');
      URL.revokeObjectURL(url);
    }, 'image/png');
  });

  btnSvg.addEventListener('click', function(){
    if(!hasContent) return;
    var text = textEl.value.trim();
    QRCode.toString(text, {
      type: 'svg',
      margin: 2,
      errorCorrectionLevel: 'M',
      color: currentColors()
    }, function(err, svgString){
      if(err){ setStatus('svgError'); return; }
      var blob = new Blob([svgString], {type:'image/svg+xml'});
      var url = URL.createObjectURL(blob);
      download(url, 'qr-code.svg');
      URL.revokeObjectURL(url);
    });
  });

  btnCopy.addEventListener('click', function(){
    if(!hasContent) return;
    canvas.toBlob(function(blob){
      if(!navigator.clipboard || !window.ClipboardItem){
        setStatus('copyUnsupported');
        return;
      }
      navigator.clipboard.write([new ClipboardItem({'image/png': blob})]).then(function(){
        setStatus('copied');
      }).catch(function(){
        setStatus('copyFailed');
      });
    }, 'image/png');
  });

  setDownloadButtons(false);
  applyLanguage('en');
})();
</script>
</body>
</html>
