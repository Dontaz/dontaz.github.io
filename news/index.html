<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dontaz News</title>
<meta name="description" content="Новости и roadmap Dontaz">
<meta name="theme-color" content="#24273a">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>

<style>
    @font-face {
        font-family: 'Montserrat';
        src: url('/fonts/Montserrat-Variable.woff2') format('woff2');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
    }
    @font-face {
        font-family: 'JetBrains Mono';
        src: url('/fonts/JetBrainsMono-Variable.woff2') format('woff2');
        font-weight: 100 800;
        font-display: swap;
    }
    :root {
        color-scheme: dark;

        /* Catppuccin Macchiato */
        --rosewater:#f4dbd6; --flamingo:#f0c6c6; --pink:#f5bde6;  --mauve:#c6a0f6;
        --red:#ed8796;       --maroon:#ee99a0;   --peach:#f5a97f; --yellow:#eed49f;
        --green:#a6da95;     --teal:#8bd5ca;     --sky:#91d7e3;   --sapphire:#7dc4e4;
        --blue:#8aadf4;      --lavender:#b7bdf8;
        --text:#cad3f5;      --subtext1:#b8c0e0; --subtext0:#a5adcb;
        --overlay2:#939ab7;  --overlay1:#8087a2; --overlay0:#6e738d;
        --surface2:#5b6078;  --surface1:#494d64; --surface0:#363a4f;
        --base:#24273a;      --mantle:#1e2030;   --crust:#181926;

        --bg:       var(--base);
        --surface:  var(--mantle);
        --surface-h:var(--surface0);
        --border:   var(--surface0);
        --border-h: var(--surface2);
        --muted:    var(--subtext0);
        --faint:    var(--overlay0);
        --accent:   var(--blue);
        --radius:   10px;

        --font: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto,
                "Helvetica Neue", Arial, sans-serif;
        --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

    body {
        margin: 0;
        padding: 40px 24px 80px;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        font-size: 15px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
    }

    .wrap { max-width: 880px; margin: 0 auto; }

    header {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 6px;
    }

    .home {
        flex: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--muted);
        text-decoration: none;
        transition: color .15s ease, background .15s ease, border-color .15s ease, transform .15s ease;
    }
    .home svg { width: 22px; height: 22px; }
    .home:hover, .home:focus-visible {
        color: var(--accent);
        background: var(--surface-h);
        border-color: var(--border-h);
        transform: translateY(-1px);
        outline: none;
    }

    h1 {
        margin: 0;
        font-family: var(--mono);
        font-size: 24px;
        font-weight: 600;
        letter-spacing: .14em;
        text-transform: uppercase;
    }
    h1 .dot { color: var(--accent); animation: blink 1.4s ease-in-out infinite; }
    @keyframes blink { 0%,45%,100%{opacity:1} 50%,95%{opacity:.25} }

    .counter {
        margin-left: auto;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
    }

    .tagline { margin: 0 0 22px 56px; color: var(--muted); font-size: 14px; }

    .searchbar {
        position: sticky;
        top: 0;
        z-index: 10;
        margin: 0 -24px 22px;
        padding: 10px 24px 12px;
        background: var(--bg);
    }

    .searchbar::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 100%;
        height: 22px;
        background: linear-gradient(var(--bg), rgba(36, 39, 58, 0));
        pointer-events: none;
    }

    .search { position: relative; }

    .search input {
        width: 100%;
        padding: 12px 74px 12px 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text);
        font: inherit;
        font-size: 16px;
        outline: none;
        transition: border-color .15s ease, background .15s ease;
        -webkit-appearance: none;
        appearance: none;
    }
    .search input::placeholder { color: var(--faint); }
    .search input:focus { border-color: var(--accent); background: var(--surface-h); }
    .search input::-webkit-search-cancel-button { display: none; }

    .search kbd {
        position: absolute; top: 50%; right: 12px; transform: translateY(-50%);
        padding: 2px 6px;
        border: 1px solid var(--border-h);
        border-radius: 5px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        pointer-events: none;
    }

    .clear {
        position: absolute; top: 50%; right: 8px; transform: translateY(-50%);
        display: none;
        width: 34px; height: 34px;
        padding: 0;
        background: none; border: 0; border-radius: 8px;
        color: var(--muted);
        font-size: 20px; line-height: 1;
        cursor: pointer;
    }
    .clear:hover, .clear:focus-visible { color: var(--text); background: var(--surface0); outline: none; }
    .search.has-text .clear { display: block; }
    .search.has-text kbd { display: none; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .chip {
        padding: 5px 12px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--muted);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        transition: color .15s ease, border-color .15s ease, background .15s ease;
    }
    .chip:hover, .chip:focus-visible { color: var(--text); border-color: var(--border-h); outline: none; }
    .chip[aria-pressed="true"] {
        color: var(--crust);
        background: var(--accent);
        border-color: var(--accent);
        font-weight: 600;
    }

    .timeline { position: relative; padding-left: 34px; }
    .timeline::before {
        content: "";
        position: absolute; left: 9px; top: 6px; bottom: 6px;
        width: 2px;
        background: linear-gradient(var(--border-h), var(--border) 92%, transparent);
        border-radius: 2px;
    }

    .group {
        position: relative;
        margin: 34px 0 14px;
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: .13em;
        text-transform: uppercase;
        color: var(--muted);
    }
    .group:first-child { margin-top: 0; }
    .group::before {
        content: "";
        position: absolute; left: -27.9px; top: 50%;
        width: 8px; height: 8px;
        margin-top: -4px;
        background: var(--border-h);
        border-radius: 2px;
        transform: rotate(45deg);
    }
    .group.planned { color: var(--mauve); }
    .group.planned::before { background: var(--mauve); }

    .item { position: relative; margin-bottom: 12px; }
    .item::before {
        content: "";
        position: absolute; left: -31.5px; top: 18px;
        width: 12px; height: 12px;
        background: var(--bg);
        border: 2px solid var(--accent);
        border-radius: 50%;
        transition: background .15s ease, box-shadow .15s ease;
    }
    .item:hover::before { background: var(--accent); box-shadow: 0 0 0 4px rgba(138,173,244,.18); }
    .item.latest::before { background: var(--accent); }
    .item.planned::before { border-style: dashed; border-color: var(--mauve); }
    .item.planned:hover::before { background: var(--mauve); box-shadow: 0 0 0 4px rgba(198,160,246,.18); }

    .card {
        padding: 15px 18px 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        transition: border-color .15s ease, background .15s ease;
    }
    .item:hover .card { background: var(--surface-h); border-color: var(--border-h); }
    .item.planned .card { border-style: dashed; }

    .meta {
        display: flex; flex-wrap: wrap; align-items: center;
        gap: 6px 10px;
        margin-bottom: 6px;
        font-family: var(--mono);
        font-size: 12px;
    }
    .date { color: var(--muted); }
    .badge {
        padding: 1px 9px;
        border: 2px solid currentColor;
        border-radius: 999px;
        font-size: 11px;
        letter-spacing: .04em;
    }
    .tag-new {
        padding: 1px 8px;
        background: var(--green);
        color: var(--crust);
        border-radius: 999px;
        font-size: 10px; font-weight: 700; letter-spacing: .08em;
    }
    .tag-plan {
        padding: 1px 8px;
        background: var(--mauve);
        color: var(--crust);
        border-radius: 999px;
        font-size: 10px; font-weight: 700; letter-spacing: .08em;
    }

    .title { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
    .desc  { margin: 6px 0 0; color: var(--subtext0); font-size: 14.5px; overflow-wrap: anywhere; white-space: pre-line; }

    mark {
        background: rgba(238,212,159,.28);
        color: var(--yellow);
        border-radius: 3px;
        padding: 0 1px;
    }

    .empty { display: none; padding: 30px 0; color: var(--muted); font-size: 14px; }
    .empty.on { display: block; }
    .empty button {
        background: none; border: 0; padding: 0;
        color: var(--accent); font: inherit; text-decoration: underline; cursor: pointer;
    }

    footer {
        margin-top: 44px; padding-top: 18px;
        border-top: 1px solid var(--border);
        display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
        font-family: var(--mono); font-size: 11px; color: var(--faint);
    }
    footer a { color: inherit; text-decoration: none; }
    footer a:hover { color: var(--accent); }

    @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; }
        h1 .dot { animation: none !important; }
        html { scroll-behavior: auto; }
    }

    @media (max-width: 600px) {
        body { padding: 20px 14px 60px; }
        h1 { font-size: 19px; letter-spacing: .1em; }
        .home { width: 40px; height: 40px; }
        header { gap: 10px; }
        .tagline { margin-left: 0; margin-bottom: 14px; }
        .searchbar { margin: 0 -14px 18px; padding: 8px 14px 10px; }
        .kbd-hint, .search kbd { display: none; }
        .search input { padding-right: 46px; }
        .timeline { padding-left: 26px; }
        .timeline::before { left: 5px; }
        .item::before { left: -27.7px; width: 11px; height: 11px; top: 17px; }
        .group::before { left: -24px; }
        .card { padding: 13px 14px 14px; }
        .title { font-size: 16px; }
    }
</style>
</head>

<body>
<div class="wrap">

    <header>
        <a class="home" href="https://dontaz.com" aria-label="На главную" title="На главную">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 10.8 12 3l9 7.8"/>
                <path d="M5.5 9.5V20a1 1 0 0 0 1 1H10v-5.5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1V21h3.5a1 1 0 0 0 1-1V9.5"/>
            </svg>
        </a>
        <h1>DONTAZ/NEWS<span class="dot">.</span></h1>
        <span class="counter" id="counter"></span>
    </header>

    <p class="tagline">Новости и roadmap моих проектов</p>

    <div class="searchbar">
        <div class="search" id="search">
            <input id="filter" type="search" inputmode="search" enterkeyhint="search"
                placeholder="Поиск: заголовок, описание, категория, дата…"
                autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                aria-label="Поиск по новостям">
            <kbd>/</kbd>
            <button class="clear" id="clear" type="button" aria-label="Очистить поиск">×</button>
        </div>
        <div class="chips" id="chips" role="group" aria-label="Фильтр по категории"></div>
    </div>

    <main>
        <div class="empty" id="empty">
            Ничего не найдено. <button type="button" id="reset">Сбросить фильтры</button>
        </div>
        <div class="timeline" id="timeline"></div>
        <noscript><p class="empty on">Для отображения новостей нужен включённый JavaScript.</p></noscript>
    </main>

    <footer>
        <span>Обновлено: <span id="updated">—</span></span>
        <a href="https://dontaz.com">dontaz.com</a>
    </footer>
</div>

<script src="news.js"></script>

<script>
(function () {
    'use strict';

    const MONTHS_NOM = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
    const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    const PALETTE    = ['--blue','--mauve','--green','--peach','--teal','--pink','--yellow','--sapphire','--lavender','--maroon'];
    const NEW_DAYS   = 14;

    const $ = id => document.getElementById(id);
    const el = {
        input: $('filter'), search: $('search'), clear: $('clear'), chips: $('chips'),
        timeline: $('timeline'), empty: $('empty'), counter: $('counter'),
        updated: $('updated'), reset: $('reset')
    };

    if (typeof NEWS === 'undefined' || !Array.isArray(NEWS)) {
        el.timeline.innerHTML = '<p class="empty on">Не удалось загрузить news.js</p>';
        return;
    }

    const pad = n => String(n).padStart(2, '0');
    const today = new Date(); today.setHours(0, 0, 0, 0);

    const items = NEWS.map((n, idx) => {
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(n.date || '').trim());
        if (!m) { console.warn('Новость пропущена: неверная дата', n); return null; }
        const y = +m[1], mo = +m[2], d = +m[3];
        const dt = new Date(y, mo - 1, d);
        const title = String(n.title || '').trim();
        const description = String(n.description || '').trim();
        const cats = (Array.isArray(n.categories) ? n.categories
                : Array.isArray(n.category)   ? n.category
                : [n.category])
            .map(c => String(c == null ? '' : c).trim())
            .filter((c, i, a) => c && a.indexOf(c) === i);

        const human = `${d} ${MONTHS_GEN[mo - 1]} ${y}`;
        const dateKeys = [
            n.date, `${pad(d)}.${pad(mo)}.${y}`, `${d}.${mo}.${y}`, `${pad(d)}/${pad(mo)}/${y}`,
            human, `${MONTHS_NOM[mo - 1]} ${y}`, `${MONTHS_GEN[mo - 1]} ${y}`
        ].join(' | ');

        return {
            idx, dt, y, mo, d, title, description, cats, human,
            iso: n.date,
            planned: dt > today,
            haystack: [title, description, cats.join(' '), dateKeys].join(' | ').toLowerCase()
        };
    }).filter(Boolean);

    items.sort((a, b) => (b.dt - a.dt) || (b.idx - a.idx));

    const latestPast = items.find(i => !i.planned);
    const categories = [...new Set(items.flatMap(i => i.cats))];
    const catsOldestFirst = [...categories].reverse();

    function catColor(cat) {
        const i = catsOldestFirst.indexOf(cat);
        return `var(${PALETTE[i % PALETTE.length]})`;
    }

    const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

    function highlight(text, tokens) {
        const frag = document.createDocumentFragment();
        if (!tokens.length) { frag.append(text); return frag; }
        const re = new RegExp('(' + tokens.map(escRe).join('|') + ')', 'giu');
        let last = 0, m;
        while ((m = re.exec(text)) !== null) {
            if (m[0] === '') { re.lastIndex++; continue; }
            if (m.index > last) frag.append(text.slice(last, m.index));
            const mark = document.createElement('mark');
            mark.textContent = m[0];
            frag.append(mark);
            last = m.index + m[0].length;
        }
        if (last < text.length) frag.append(text.slice(last));
        return frag;
    }

    function make(tag, cls, content, tokens) {
        const node = document.createElement(tag);
        if (cls) node.className = cls;
        if (content != null) {
            const hasHtml = /<[a-z][\s\S]*?>/i.test(content);
            if (hasHtml) {
                node.innerHTML = content;
            } else {
                node.append(tokens ? highlight(content, tokens) : content);
            }
        }
        return node;
    }

    let activeCat = '';

    function matches(item, tokens) {
        if (activeCat && !item.cats.includes(activeCat)) return false;
        return tokens.every(t => item.haystack.includes(t));
    }

    function render() {
        const raw = el.input.value.trim().toLowerCase();
        const tokens = raw ? [...new Set(raw.split(/\s+/))] : [];
        const list = items.filter(i => matches(i, tokens));

        el.search.classList.toggle('has-text', el.input.value.length > 0);
        el.timeline.textContent = '';

        let lastKey = null;
        const frag = document.createDocumentFragment();

        list.forEach(item => {
            const key = item.planned ? 'planned' : `${item.y}-${pad(item.mo)}`;
            if (key !== lastKey) {
                lastKey = key;
                const label = item.planned
                    ? 'В планах'
                    : `${MONTHS_NOM[item.mo - 1]} ${item.y}`;
                frag.append(make('div', 'group' + (item.planned ? ' planned' : ''), label));
            }

            const cls = 'item' + (item.planned ? ' planned' : '') + (item === latestPast ? ' latest' : '');
            const art = make('article', cls);
            const card = make('div', 'card');

            const meta = make('div', 'meta');
            const time = make('time', 'date', item.human, tokens);
            time.dateTime = item.iso;
            time.title = item.iso;
            meta.append(time);

            item.cats.forEach(cat => {
                const b = make('span', 'badge', cat, tokens);
                b.style.color = catColor(cat);
                meta.append(b);
            });
            if (item.planned) {
                meta.append(make('span', 'tag-plan', 'PLAN'));
            } else if ((today - item.dt) / 864e5 <= NEW_DAYS) {
                meta.append(make('span', 'tag-new', 'NEW'));
            }

            card.append(meta, make('h3', 'title', item.title, tokens));
            if (item.description) card.append(make('p', 'desc', item.description, tokens));

            art.append(card);
            frag.append(art);
        });

        el.timeline.append(frag);
        el.empty.classList.toggle('on', list.length === 0);
        el.timeline.style.display = list.length ? '' : 'none';
        el.counter.textContent = (tokens.length || activeCat)
            ? `${list.length} из ${items.length}`
            : `${items.length} ${plural(items.length)}`;
    }

    function plural(n) {
        const a = n % 10, b = n % 100;
        if (a === 1 && b !== 11) return 'новость';
        if (a >= 2 && a <= 4 && (b < 10 || b >= 20)) return 'новости';
        return 'новостей';
    }

    function buildChips() {
        if (categories.length < 2) { el.chips.style.display = 'none'; return; }
        const mk = (label, value) => {
            const b = make('button', 'chip', label);
            b.type = 'button';
            b.dataset.cat = value;
            b.setAttribute('aria-pressed', value === activeCat ? 'true' : 'false');
            b.addEventListener('click', () => {
                activeCat = (activeCat === value) ? '' : value;
                syncChips();
                render();
            });
            return b;
        };
        el.chips.append(mk('Все', ''), ...categories.map(c => mk(c, c)));
        syncChips();
    }

    function syncChips() {
        el.chips.querySelectorAll('.chip').forEach(b => {
            b.setAttribute('aria-pressed', b.dataset.cat === activeCat ? 'true' : 'false');
        });
    }

    function resetAll() {
        el.input.value = ''; activeCat = ''; syncChips(); render();
    }

    el.input.addEventListener('input', render);
    el.clear.addEventListener('click', () => { el.input.value = ''; render(); el.input.focus(); });
    el.reset.addEventListener('click', resetAll);

    document.addEventListener('keydown', e => {
        const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
        if (e.key === '/' && !typing) { e.preventDefault(); el.input.focus(); }
        if (e.key === 'Escape' && document.activeElement === el.input) {
            el.input.value = ''; render(); el.input.blur();
        }
    });

    const newest = latestPast || items[0];
    el.updated.textContent = newest ? newest.human : '—';
    buildChips();
    render();
})();
</script>
</body>
</html>
