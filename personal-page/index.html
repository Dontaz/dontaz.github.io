<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Dontaz / Персональная страница</title>

	<meta name="description" content="Персональная страница Dontaz со списком проектом.">
	<meta property="og:title" content="Dontaz / Персональная страница">
	<meta property="og:description" content="Русификаторы, инструменты, игры и скрипты для браузера от Dontaz.">
	<meta property="og:url" content="https://dontaz.com/personal-page/">
	<meta property="og:type" content="website">
	<meta name="twitter:card" content="summary">
	<meta name="twitter:title" content="Dontaz / Персональная страница">
	<meta name="twitter:description" content="Русификаторы, инструменты, игры и скрипты для браузера от Dontaz.">
	<link rel="canonical" href="https://dontaz.com/personal-page/">
	<meta name="theme-color" content="#050505">

	<link rel="icon" href="favicon.ico" sizes="32x32">
	<link rel="icon" href="favicon.svg" type="image/svg+xml">
	<link rel="icon" href="favicon.png" type="image/png" sizes="96x96">
	<link rel="apple-touch-icon" href="favicon.png">

	<style>
		@font-face {
			font-family: 'Montserrat';
			src: url('/fonts/Montserrat-Variable.woff2') format('woff2');
			font-weight: 100 900;
			font-style: normal;
			font-display: swap;
		}
		@font-face {
			font-family: 'JetBrains Mono';
			src: url('/fonts/JetBrainsMono-Variable.woff2') format('woff2');
			font-weight: 100 800;
			font-display: swap;
		}

		:root {
			--bg-color: #050505;
			--card-bg: #0a0a0a;
			--text-main: #ededed;
			--text-secondary: #a1a1aa;
			--accent: #7c3aed;
			--accent-gradient: linear-gradient(135deg, #7c3aed 0%, #2563eb 100%);
			--accent-glow: rgba(124, 58, 237, 0.6);
			--modal-overlay: rgba(0, 0, 0, 0.85);
			--font: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
			--mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
		}

		::selection {
			background: rgba(124, 58, 237, 0.9);
			color: white;
			text-shadow: 0 0 5px rgba(255,255,255,0.5);
		}

		html {
			scrollbar-color: #3f3f46 rgba(255, 255, 255, 0.02);
			scrollbar-width: auto;
		}

		body::-webkit-scrollbar { width: 10px; }
		body::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
		body::-webkit-scrollbar-thumb { background-color: #3f3f46; border-radius: 5px; border: 2px solid #050505; }
		body::-webkit-scrollbar-thumb:hover { background-color: var(--accent); }

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: var(--font);
		}

		body {
			background-color: var(--bg-color);
			color: var(--text-main);
			line-height: 1.6;
			min-height: 100vh;
			position: relative;
			overflow-x: hidden;
		}

		.gradient-bg {
			position: fixed;
			top: 0; left: 0;
			width: 100%; height: 100%;
			z-index: -2;
			background: radial-gradient(circle at 50% 0%, #1e1e2e 0%, #050505 70%);
		}

		.gradient-bg::before {
			content: "";
			position: absolute;
			top: 0; left: -50%;
			width: 200%; height: 100%;
			background-image:
				linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
				linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
			background-size: 40px 40px;
			transform: perspective(1000px) rotateX(60deg);
			-webkit-mask-image: radial-gradient(circle at 50% 50%, black 10%, transparent 60%);
			mask-image: radial-gradient(circle at 50% 50%, black 10%, transparent 60%);
		}

		.noise {
			position: fixed;
			top: 0; left: 0;
			width: 100%; height: 100%;
			opacity: 0.04;
			z-index: -1;
			pointer-events: none;
			background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
		}

		.container {
			max-width: 1200px;
			margin: 0 auto;
			padding: 20px;
		}

		header {
			text-align: center;
			padding: 80px 20px 20px;
		}

		.logo-title {
			font-size: 6.5rem;
			font-weight: 800;
			letter-spacing: -2px;
			line-height: 1;
			margin-bottom: 15px;
			cursor: text;
			display: block;
			background: var(--accent-gradient);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			text-shadow: 0 0 30px rgba(124, 58, 237, 0.3);
			transition: text-shadow 0.3s ease;
		}

		.logo-title:hover {
			text-shadow: 0 0 20px rgba(124, 58, 237, 0.6), 0 0 40px rgba(37, 99, 235, 0.4);
		}

		header p {
			color: var(--text-secondary);
			max-width: 600px;
			margin: 0 auto;
			font-size: 1.1rem;
		}

		.controls-container {
			display: flex;
			justify-content: center;
			align-items: center;
			gap: 20px;
			margin-top: 40px;
			flex-wrap: wrap;
		}

		#poda, .btn-poda {
			display: flex;
			align-items: center;
			justify-content: center;
			position: relative;
		}

		.btn-poda {
			cursor: pointer;
			height: 56px;
			text-decoration: none;
		}

		.white, .border, .darkBorderBg, .glow {
			position: absolute;
			left: 50%; top: 50%;
			transform: translate(-50%, -50%);
			overflow: hidden;
			z-index: -1;
			border-radius: 12px;
			filter: blur(3px);
			pointer-events: none;
		}

		.white { width: calc(100% + 6px); height: calc(100% + 7px); border-radius: 10px; filter: blur(2px); }
		.border { width: calc(100% + 2px); height: calc(100% + 3px); border-radius: 11px; filter: blur(0.5px); }
		.darkBorderBg { width: calc(100% + 11px); height: calc(100% + 9px); }
		.glow { width: calc(100% + 40px); height: calc(100% + 40px); filter: blur(30px); opacity: 0.4; }

		.white::before, .border::before, .darkBorderBg::before, .glow::before {
			content: "";
			z-index: -2;
			text-align: center;
			top: 50%; left: 50%;
			position: absolute;
			width: 600px; height: 600px;
			background-repeat: no-repeat;
			background-position: 0 0;
			transition: all 6s;
		}

		.white::before {
			transform: translate(-50%, -50%) rotate(83deg);
			filter: brightness(1.4);
			background-image: conic-gradient(rgba(0,0,0,0) 0%, #a78bfa, rgba(0,0,0,0) 8%, rgba(0,0,0,0) 50%, #7c3aed, rgba(0,0,0,0) 58%);
		}
		.border::before {
			transform: translate(-50%, -50%) rotate(70deg);
			filter: brightness(1.3);
			background-image: conic-gradient(#1c191c, #2563eb 5%, #1c191c 14%, #1c191c 50%, #7c3aed 60%, #1c191c 64%);
		}
		.darkBorderBg::before {
			transform: translate(-50%, -50%) rotate(82deg);
			background-image: conic-gradient(rgba(0,0,0,0), #1e1b4b, rgba(0,0,0,0) 10%, rgba(0,0,0,0) 50%, #2e1065, rgba(0,0,0,0) 60%);
		}
		.glow::before {
			transform: translate(-50%, -50%) rotate(60deg);
			width: 999px; height: 999px;
			background-image: conic-gradient(#000, #2563eb 5%, #000 38%, #000 50%, #7c3aed 60%, #000 87%);
		}

		#poda:hover > .white::before, .btn-poda:hover > .white::before { transform: translate(-50%, -50%) rotate(-97deg); }
		#poda:hover > .border::before, .btn-poda:hover > .border::before { transform: translate(-50%, -50%) rotate(-110deg); }
		#poda:hover > .darkBorderBg::before, .btn-poda:hover > .darkBorderBg::before { transform: translate(-50%, -50%) rotate(-98deg); }
		#poda:hover > .glow::before, .btn-poda:hover > .glow::before { transform: translate(-50%, -50%) rotate(-120deg); }

		#poda:focus-within > .white::before, .btn-poda:active > .white::before { transform: translate(-50%, -50%) rotate(443deg); transition: all 12s; }
		#poda:focus-within > .border::before, .btn-poda:active > .border::before { transform: translate(-50%, -50%) rotate(430deg); transition: all 12s; }
		#poda:focus-within > .darkBorderBg::before, .btn-poda:active > .darkBorderBg::before { transform: translate(-50%, -50%) rotate(442deg); transition: all 12s; }
		#poda:focus-within > .glow::before, .btn-poda:active > .glow::before { transform: translate(-50%, -50%) rotate(420deg); transition: all 12s; }

		.input {
			background-color: #010201;
			border: none;
			width: 301px;
			height: 56px;
			border-radius: 10px;
			color: white;
			padding-inline: 59px;
			font-size: 18px;
			font-family: var(--font);
			position: relative;
			z-index: 10;
		}
		.input::placeholder { color: #c0b9c0; }
		.input:focus { outline: none; }

		.btn-content-wrapper {
			background-color: #010201;
			z-index: 10;
			height: 56px;
			border-radius: 10px;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 12px;
			padding: 0 30px;
			color: #fff;
			font-size: 1rem;
			font-weight: 500;
			user-select: none;
			white-space: nowrap;
		}

		#filter-icon {
			position: absolute;
			top: 8px; right: 8px;
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 12;
			max-height: 40px; max-width: 38px;
			height: 100%; width: 100%;
			isolation: isolate;
			overflow: hidden;
			border-radius: 10px;
			background: linear-gradient(180deg, #161329, black, #1d1b4b);
			border: 1px solid transparent;
			cursor: pointer;
		}

		.filterBorder {
			height: 42px; width: 40px;
			position: absolute;
			overflow: hidden;
			top: 7px; right: 7px;
			border-radius: 10px;
			z-index: 11;
		}

		@keyframes rotate {
			from { transform: translate(-50%, -50%) rotate(90deg); }
			to { transform: translate(-50%, -50%) rotate(450deg); }
		}

		.filterBorder::before {
			content: "";
			text-align: center;
			top: 50%; left: 50%;
			transform: translate(-50%, -50%) rotate(90deg);
			position: absolute;
			width: 600px; height: 600px;
			background-repeat: no-repeat;
			background-position: 0 0;
			filter: brightness(1.35);
			background-image: conic-gradient(rgba(0,0,0,0), #1e1b4b, rgba(0,0,0,0) 50%, rgba(0,0,0,0) 50%, #7c3aed, rgba(0,0,0,0) 100%);
			animation: rotate 4s linear infinite;
		}

		@media (prefers-reduced-motion: reduce) {
			.filterBorder::before { animation: none; }
			* { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
		}

		#main { position: relative; }

		#search-icon {
			position: absolute;
			left: 20px; top: 15px;
			pointer-events: none;
			z-index: 12;
		}

		.sun-icon {
			width: 22px; height: 22px;
			color: #a78bfa;
		}

		.filter-dropdown {
			position: absolute;
			top: 70px; left: 0;
			width: 314px;
			background: rgba(10, 10, 10, 0.95);
			backdrop-filter: blur(15px);
			border: 1px solid rgba(124, 58, 237, 0.3);
			border-radius: 16px;
			padding: 15px;
			display: none;
			grid-template-columns: repeat(2, 1fr);
			gap: 8px;
			z-index: 100;
			box-shadow: 0 10px 30px rgba(0,0,0,0.8);
			animation: fadeIn 0.2s ease;
		}

		@keyframes fadeIn {
			from { opacity: 0; transform: translateY(-10px); }
			to { opacity: 1; transform: translateY(0); }
		}

		.filter-dropdown.active { display: grid; }

		.filter-tag-item {
			background: rgba(255, 255, 255, 0.05);
			color: #d4d4d8;
			padding: 8px 12px;
			border-radius: 8px;
			font-size: 0.8rem;
			text-align: center;
			cursor: pointer;
			border: 1px solid rgba(255, 255, 255, 0.1);
			transition: background 0.2s, border-color 0.2s, color 0.2s;
		}

		.filter-tag-item:hover {
			background: rgba(124, 58, 237, 0.2);
			border-color: var(--accent);
			color: white;
		}

		[hidden] {
			display: none !important;
		}

		.projects-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr));
			gap: 30px;
			padding: 20px 0 60px;
		}

		.card {
			background-color: var(--card-bg);
			border-radius: 16px;
			overflow: hidden;
			cursor: pointer;
			position: relative;
			display: flex;
			flex-direction: column;
			border: 2px solid rgba(255, 255, 255, 0.08);
			box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
			transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), border-color 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
			content-visibility: auto;
			contain-intrinsic-size: 470px;
			text-decoration: none;
			color: inherit;
		}

		.card:hover {
			transform: translateY(-7px);
			background: linear-gradient(var(--card-bg), var(--card-bg)) padding-box, linear-gradient(135deg, #7c3aed, #2563eb, #a78bfa, #7c3aed) border-box;
			background-size: 300% 300%;
			animation: gradientBorder 4s ease infinite;
			border-color: transparent;
			box-shadow: 0 15px 35px -5px rgba(124, 58, 237, 0.35), 0 0 10px rgba(124, 58, 237, 0.2), inset 0 0 20px rgba(0,0,0,0.8);
		}

		.card:focus-visible {
			outline: 2px solid var(--accent);
			outline-offset: 2px;
			transform: translateY(-4px);
		}

		.card:active {
			transform: scale(0.98) translateY(-5px);
			transition: transform 0.1s ease;
		}

		@keyframes gradientBorder {
			0% { background-position: 0% 50%; }
			50% { background-position: 100% 50%; }
			100% { background-position: 0% 50%; }
		}

		.card-image {
			aspect-ratio: 16 / 9;
			position: relative;
			overflow: hidden;
			background-color: #1a1a1a;
			flex-shrink: 0;
			border-bottom: 1px solid rgba(255,255,255,0.05);
		}

		.card-image img {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			object-fit: cover;
			object-position: center top;
			user-select: none;
			pointer-events: none;
			transition: transform 0.4s ease, filter 0.4s ease;
		}

		.card:hover .card-image img {
			transform: scale(1.05);
		}

		.card-content {
			padding: 25px;
			display: flex;
			flex-direction: column;
			flex-grow: 1;
			position: relative;
			z-index: 2;
		}

		.card-title {
			font-size: 1.4rem;
			margin-bottom: 8px;
			font-weight: 700;
			color: #fff;
			transition: color 0.3s;
		}

		.card:hover .card-title {
			background: var(--accent-gradient);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
		}

		.card-short-desc {
			color: var(--text-secondary);
			font-size: 0.95rem;
			margin-bottom: 20px;
			line-height: 1.5;
			flex-grow: 1;
		}

		.card-tags {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
			margin-top: auto;
		}

		.tag {
			background: rgba(255, 255, 255, 0.05);
			color: #d4d4d8;
			padding: 6px 14px;
			border-radius: 20px;
			font-size: 0.75rem;
			font-weight: 500;
			border: 1px solid rgba(255, 255, 255, 0.08);
			transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
			display: inline-flex;
			align-items: center;
		}

		.card:hover .tag {
			border-color: rgba(124, 58, 237, 0.5);
			background: rgba(124, 58, 237, 0.1);
			color: #fff;
		}

		.no-results {
			display: none;
			text-align: center;
			padding: 60px 20px;
			color: var(--text-secondary);
			font-size: 1.1rem;
			grid-column: 1 / -1;
		}

		.no-results.visible { display: block; }

		dialog {
			background-color: #0f0f0f;
			border-radius: 20px;
			max-width: 650px;
			width: calc(100% - 40px);
			border: 1px solid rgba(124, 58, 237, 0.2);
			box-shadow: 0 0 50px -10px rgba(124, 58, 237, 0.2);
			position: fixed;
			inset: 0;
			margin: auto;
			flex-direction: column;
			max-height: 85vh;
			padding: 0;
			overflow: hidden;
			color: var(--text-main);
		}

		dialog::backdrop {
			background: var(--modal-overlay);
			backdrop-filter: blur(8px);
		}

		dialog[open] {
			display: flex;
			animation: dialogIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
		}

		@keyframes dialogIn {
			from { opacity: 0; transform: scale(0.95) translateY(20px); }
			to { opacity: 1; transform: scale(1) translateY(0); }
		}

		.modal-header {
			padding: 30px 40px 10px 40px;
			flex-shrink: 0;
			position: relative;
			background-color: #0f0f0f;
			z-index: 20;
		}

		.modal-body {
			padding: 10px 40px 40px 40px;
			overflow-y: auto;
			flex-grow: 1;
		}

		.modal-body::-webkit-scrollbar { width: 8px; }
		.modal-body::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 4px; }
		.modal-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
		.modal-body::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

		.close-btn {
			position: absolute;
			top: 25px; right: 25px;
			font-size: 2.5rem;
			cursor: pointer;
			color: var(--text-secondary);
			transition: color 0.2s ease;
			line-height: 1;
			font-weight: 300;
			z-index: 30;
			background: none;
			border: none;
			padding: 0;
		}

		.close-btn:hover { color: #ffffff; }

		.close-btn:focus-visible {
			outline: 2px solid var(--accent);
			outline-offset: 4px;
			border-radius: 4px;
		}

		#modal-title {
			margin-bottom: 10px;
			font-size: 2rem;
			background: var(--accent-gradient);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			display: inline-block;
			margin-right: 40px;
		}

		#modal-desc {
			color: #d1d5db;
			font-size: 1rem;
			line-height: 1.7;
			white-space: pre-line;
		}

		#modal-desc a {
			color: #a78bfa;
			text-decoration: none;
			border-bottom: 1px dashed #a78bfa;
			transition: color 0.2s ease, border-bottom-style 0.2s ease;
			font-weight: 600;
		}

		#modal-desc a:hover {
			color: #fff;
			border-bottom-style: solid;
		}

		#modal-tags {
			display: flex;
			flex-wrap: wrap;
			gap: 10px;
			margin-top: 30px;
			border-top: 1px solid #333;
			padding-top: 20px;
		}

		#modal-tags .tag {
			background: rgba(124, 58, 237, 0.15);
			color: #a78bfa;
			border-color: rgba(124, 58, 237, 0.3);
		}

		footer {
			position: relative;
			margin-top: auto;
			width: 100%;
			background: linear-gradient(to top, rgba(124, 58, 237, 0.05) 0%, transparent 100%);
			padding-bottom: 30px;
		}

		.footer-divider {
			height: 1px;
			width: 100%;
			max-width: 1200px;
			margin: 0 auto;
			background: linear-gradient(90deg, transparent, var(--accent), transparent);
			opacity: 0.5;
			box-shadow: 0 0 10px var(--accent);
		}

		.footer-content {
			max-width: 1200px;
			margin: 0 auto;
			padding: 30px 20px;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 10px;
		}

		.copyright {
			color: var(--text-secondary);
			font-size: 0.95rem;
			font-weight: 500;
			display: flex;
			align-items: center;
			gap: 5px;
		}

		.logo-text-small {
			color: var(--accent);
			font-weight: 800;
			font-size: 1.2rem;
		}

		.footer-links {
			display: flex;
			gap: 25px;
		}

	function normalizeYo(s) {
		return s.replace(/ё/g, 'е').replace(/Ё/g, 'Е');
	}

	const modal = document.getElementById('card-modal');
	const modalTitle = document.getElementById('modal-title');
	const modalDesc = document.getElementById('modal-desc');
	const modalTags = document.getElementById('modal-tags');
	const modalClose = document.getElementById('modal-close');
	const grid = document.getElementById('projects-grid');
	const noResults = document.getElementById('no-results');
	const noResultsQuery = document.getElementById('no-results-query');
	const filterDropdown = document.getElementById('filter-dropdown');
	const filterIcon = document.getElementById('filter-icon');
	const searchInput = document.getElementById('search-input');
	const template = document.getElementById('card-template');

	const allTags = new Set();
	CARDS.forEach(c => {
		c.tags.split(',').forEach(t => {
			const clean = t.trim();
			if (!/^\d{4}\.\d{2}\.\d{2}$/.test(clean)) allTags.add(clean);
		});
	});

	allTags.forEach(tag => {
		const btn = document.createElement('div');
		btn.className = 'filter-tag-item';
		btn.textContent = tag;
		btn.setAttribute('role', 'option');
		btn.setAttribute('tabindex', '0');
		btn.addEventListener('click', e => {
			e.stopPropagation();
			searchInput.value = searchInput.value.trim() === tag ? '' : tag;
			searchInput.dispatchEvent(new Event('input'));
			filterDropdown.classList.remove('active');
			filterIcon.setAttribute('aria-expanded', 'false');
			searchInput.focus();
		});
		btn.addEventListener('keydown', e => {
			if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); btn.click(); }
		});
		filterDropdown.appendChild(btn);
	});

	filterIcon.addEventListener('click', e => {
		e.stopPropagation();
		const open = filterDropdown.classList.toggle('active');
		filterIcon.setAttribute('aria-expanded', String(open));
	});
	filterIcon.addEventListener('keydown', e => {
		if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); filterIcon.click(); }
	});
	document.addEventListener('click', e => {
		if (!filterDropdown.contains(e.target) && !filterIcon.contains(e.target)) {
			filterDropdown.classList.remove('active');
			filterIcon.setAttribute('aria-expanded', 'false');
		}
	});

	function renderCards(term) {
		const q = term.trim();
		const qNorm = normalizeYo(q.toLowerCase());
		let count = 0;
		const cards = grid.querySelectorAll('.card');
		cards.forEach(card => {
			const title = normalizeYo(card.dataset.title.toLowerCase());
			const tags = normalizeYo(card.dataset.tags.toLowerCase());
			const shortDesc = normalizeYo(card.querySelector('.card-short-desc').textContent.toLowerCase());
			const match = !qNorm || title.includes(qNorm) || tags.includes(qNorm) || shortDesc.includes(qNorm);
			card.hidden = !match;
			if (match) count++;
		});
		noResultsQuery.textContent = q;
		noResults.classList.toggle('visible', count === 0 && q.length > 0);
	}

	searchInput.addEventListener('input', e => renderCards(e.target.value));

	const cardsBySlug = new Map();

	function slugFromHash() {
		try { return decodeURIComponent(location.hash.slice(1)); } catch (e) { return ''; }
	}

	function openCard(slug, pushHistory) {
		const card = cardsBySlug.get(slug);
		if (!card) return;
		modalTitle.textContent = card.dataset.title;
		modalDesc.innerHTML = card.dataset.desc;
		modalTags.innerHTML = '';
		card.dataset.tags.split(',').forEach(t => {
			const span = document.createElement('span');
			span.className = 'tag';
			span.textContent = t.trim();
			modalTags.appendChild(span);
		});
		if (!modal.open) modal.showModal();
		modal.querySelector('.modal-body').scrollTop = 0;
		modal.querySelector('.close-btn').focus();
		if (pushHistory && location.hash !== '#' + slug) {
			history.pushState({ card: slug }, '', '#' + slug);
		}
	}

	modalClose.addEventListener('click', () => modal.close());
	modal.addEventListener('click', e => { if (e.target === modal) modal.close(); });
	modal.addEventListener('close', () => {
		if (!location.hash) return;
		if (history.state && history.state.card) history.back();
		else history.replaceState(null, '', location.pathname + location.search);
	});

	document.addEventListener('keydown', e => {
		if (e.key === 'Escape' && modal.open) modal.close();
	});

	CARDS.forEach((data, i) => {
		const frag = template.content.cloneNode(true);
		const card = frag.querySelector('.card');
		const img = frag.querySelector('img');
		const title = frag.querySelector('.card-title');
		const shortDesc = frag.querySelector('.card-short-desc');
		const tagsEl = frag.querySelector('.card-tags');

		card.dataset.title = data.title;
		card.dataset.tags = data.tags;
		card.dataset.desc = data.desc;
		card.dataset.slug = data.slug;
		card.href = '#' + data.slug;
		cardsBySlug.set(data.slug, card);

		img.src = data.img;
		img.alt = data.title;
		if (i < 3) {
			img.removeAttribute('loading');
			img.fetchPriority = 'high';
			img.decoding = 'sync';
		} else {
			img.loading = 'lazy';
			img.decoding = 'async';
		}

		title.textContent = data.title;
		shortDesc.textContent = data.short;

		data.tags.split(',').forEach(t => {
			const clean = t.trim();
			if (!/^\d{4}\.\d{2}\.\d{2}$/.test(clean)) {
				const span = document.createElement('span');
				span.className = 'tag';
				span.textContent = clean;
				tagsEl.appendChild(span);
			}
		});

		card.addEventListener('click', e => {
			if (e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
			e.preventDefault();
			openCard(data.slug, true);
		});

		card.addEventListener('keydown', e => {
			if ((e.key === 'Enter' || e.key === ' ') && !e.ctrlKey && !e.metaKey && !e.shiftKey && !e.altKey) {
				e.preventDefault();
				openCard(data.slug, true);
			}
		});

		grid.insertBefore(frag, noResults);
	});

	const params = new URLSearchParams(location.search);
	const q = params.get('q');
	if (q) {
		searchInput.value = q;
		renderCards(q);
	}

	searchInput.addEventListener('input', e => {
		const val = e.target.value;
		const url = new URL(location.href);
		if (val.trim()) url.searchParams.set('q', val.trim());
		else url.searchParams.delete('q');
		history.replaceState(null, '', url);
	});
	window.addEventListener('hashchange', () => {
		const slug = slugFromHash();
		if (cardsBySlug.has(slug)) openCard(slug, false);
		else if (modal.open) modal.close();
	});

	const initialSlug = slugFromHash();
	if (cardsBySlug.has(initialSlug)) openCard(initialSlug, false);
	</script>
